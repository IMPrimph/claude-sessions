name: CI

# Build, type-check, lint and test on every push and pull request, so a broken build
# is caught here instead of in a tagged release.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # Also produces dist/, which the Rust build embeds, so it must run before clippy/tests.
      - name: Build frontend
        run: npm run build

      - name: Type check
        run: npm run check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
